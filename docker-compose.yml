version: "3.9"

services:
  snapbot:
    build: .
    container_name: snapbot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - snapbot-net

  # Optional: Nginx reverse proxy (needed for HTTPS in self-hosted deployments)
  nginx:
    image: nginx:alpine
    container_name: snapbot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # place your SSL certs here
    depends_on:
      - snapbot
    networks:
      - snapbot-net
    profiles:
      - prod  # only starts with: docker compose --profile prod up

networks:
  snapbot-net:
    driver: bridge
